name: Release

# Builds Anne's Lens for every platform and publishes one GitHub release:
#   Web (zip + installable PWA)        Windows (installer x64/arm64, portable x64)
#   macOS (universal .dmg/.zip)        Linux x64/arm64/armv7l (AppImage, .deb): desktop Linux,
#   iOS (unsigned .ipa)                Raspberry Pi OS (arm64, armhf) and ChromeOS (Linux apps)
#   Android (APK, AAB)                 ChromeOS can also run the APK or install the web app.
# Run it from the Actions tab (any branch: published as a prerelease v<version>-build.<run>),
# push a tag v<version>, or push a commit whose message contains [release] (prerelease).
# The last option exists for environments that may push branches but not tags; it only counts for pushes made by the
# repository's owner, so a merged pull request or a collaborator's commit message cannot publish a release.
# Third-party actions are pinned to commit SHAs (the tag each one was resolved from is in the comment).

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to create, e.g. v0.5.0 (for sessions that can push branches but not tags). Empty: v<version>-build.<run>'
        type: string
        default: ''
      prerelease:
        description: 'Mark the release as a prerelease'
        type: boolean
        default: true
  push:
    tags: ['v*']
    branches: ['**']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  web:
    name: Web
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.actor == github.repository_owner && contains(github.event.head_commit.message, '[release]'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - id: v
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Package
        run: |
          mkdir -p out
          (cd dist && zip -qr "../out/QuillLens-${{ steps.v.outputs.version }}-web.zip" .)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: QuillLens-web
          path: out/*.zip
          if-no-files-found: error

  desktop:
    name: Desktop (${{ matrix.name }})
    needs: web
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Linux, os: ubuntu-latest, args: --linux }
          - { name: Windows, os: windows-latest, args: --win }
          - { name: macOS, os: macos-latest, args: --mac }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22, cache: npm }
      - run: npm ci
      # The desktop build carries its runtimes (PDF, OCR, the extra decoders): the app's Content Security Policy allows no CDN.
      - run: npm run build:desktop
      - run: node scripts/prepare-desktop.mjs
      - name: Check the staged desktop app
        shell: bash
        run: |
          node --check build/desktop-app/electron/main.cjs
          node --check build/desktop-app/electron/preload.cjs
          test -f build/desktop-app/dist/index.html
          test -f build/desktop-app/dist/runtimes.json
          test -f build/desktop-app/dist/pdf/build/pdf.min.mjs
          test -f build/desktop-app/dist/ocr/worker.min.js
          test -f build/desktop-app/dist/openjpeg/dist/openjpegjs_decode.js
      - name: Package
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --config electron-builder.config.cjs ${{ matrix.args }} --publish never
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: QuillLens-desktop-${{ matrix.name }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.AppImage
            release/*.deb
          if-no-files-found: error

  ios:
    name: iOS (unsigned)
    needs: web
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build
      - run: npx cap sync ios
      - name: Build
        env:
          V: ${{ needs.web.outputs.version }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build/ios \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            MARKETING_VERSION="$V" CURRENT_PROJECT_VERSION="$RUN_NUMBER" build
          mkdir -p out/Payload
          cp -R build/ios/Build/Products/Release-iphoneos/App.app out/Payload/
          (cd out && zip -qry "QuillLens-$V-ios-unsigned.ipa" Payload && rm -rf Payload)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: QuillLens-ios
          path: out/*.ipa
          if-no-files-found: error

  android:
    name: Android
    needs: web
    uses: ./.github/workflows/android.yml
    with:
      prerelease: false
    permissions:
      contents: write

  publish:
    name: Publish release
    needs: [web, desktop, ios, android]
    # Publish whatever built, as long as the tested web build did; the notes list any failures.
    if: ${{ !cancelled() && needs.web.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: QuillLens-*
          path: out
          merge-multiple: true
      - name: Checksums
        run: |
          cd out
          ls -la
          sha256sum QuillLens-* > SHA256SUMS.txt
      - id: meta
        # Inputs reach the script as environment variables, never as text pasted into it.
        env:
          V: ${{ needs.web.outputs.version }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_PRERELEASE: ${{ inputs.prerelease }}
          RUN_NUMBER: ${{ github.run_number }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [[ -n "$INPUT_TAG" ]]; then
            [[ "$INPUT_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.+][0-9A-Za-z.-]+)?$ ]] || { echo "::error::The tag input must look like v1.2.3 or v1.2.3-beta.1"; exit 1; }
            TAG="$INPUT_TAG"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then TAG="${GITHUB_REF#refs/tags/}"; else TAG="v$V-build.$RUN_NUMBER"; fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          # Tags: prerelease when the version has a suffix (v1.0.0-beta.1). Manual runs: the checkbox.
          # [release] commits: always a prerelease.
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then [[ "$TAG" == *-* ]] && PRE=true || PRE=false
          elif [[ "$EVENT_NAME" == workflow_dispatch ]]; then PRE="$INPUT_PRERELEASE"
          else PRE=true; fi
          echo "prerelease=$PRE" >> "$GITHUB_OUTPUT"
          FAILED=""
          for j in "desktop:${{ needs.desktop.result }}" "ios:${{ needs.ios.result }}" "android:${{ needs.android.result }}"; do
            [[ "${j#*:}" == success ]] || FAILED="$FAILED ${j%%:*}"
          done
          echo "failed=$FAILED" >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Anne's Lens ${{ steps.meta.outputs.tag }}
          prerelease: ${{ steps.meta.outputs.prerelease == 'true' }}
          make_latest: ${{ steps.meta.outputs.prerelease != 'true' }}
          generate_release_notes: true
          body: |
            Built from `${{ github.ref_name }}` at ${{ github.sha }}. Installation for each platform: docs/INSTALL.md.

            | Platform | File |
            |---|---|
            | Windows 10/11 | `*-windows-x64-setup.exe`, `*-windows-arm64-setup.exe`, or `*-windows-portable.exe` (no install) |
            | macOS 11+ (Apple silicon and Intel) | `*-mac-universal.dmg` (unsigned: right-click ▸ Open the first time) |
            | Linux | `*-linux-x86_64.AppImage` or `*-linux-amd64.deb` |
            | Raspberry Pi OS | 64-bit: `*-linux-arm64.deb` / `*-linux-arm64.AppImage`; 32-bit: `*-linux-armv7l.deb` |
            | ChromeOS | the Android `.apk`, the Linux `.deb` (Linux development environment), or install the web app from the browser |
            | Android 7+ | `*.apk` (sideload) or `*.aab` (Play Console) |
            | iOS / iPadOS 15+ | `*-ios-unsigned.ipa`: must be signed with your own Apple ID (e.g. Sideloadly, AltStore) |
            | Web | `*-web.zip`: put the files on any static web server (HTTPS for offline use and installing) |

            ${{ steps.meta.outputs.failed && format('**Not in this release (build failed):**{0}', steps.meta.outputs.failed) || '' }}
          files: |
            out/QuillLens-*
            out/SHA256SUMS.txt
