name: Android

on:
  push:
    branches: ['**']
    # Tags v* are released for every platform by release.yml.
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'LICENSE'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'LICENSE'
  workflow_dispatch:
    inputs:
      prerelease:
        description: 'Publish this build as a GitHub prerelease (works from any branch)'
        type: boolean
        default: false
  # Called by release.yml, which publishes every platform together.
  workflow_call:
    inputs:
      prerelease:
        type: boolean
        default: false

concurrency:
  # github.workflow is the caller's name when called from release.yml, so the two never cancel each other.
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

jobs:
  build:
    name: Build APK + AAB
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Building needs no write access; the prerelease job below publishes.
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # versionCode must only grow, whichever workflow (Android or Release) builds the APK, so it is
      # minutes since 2024-01-01 rather than a per-workflow run number.
      - name: Version code
        run: echo "VERSION_CODE=$(( ($(date -u +%s) - 1704067200) / 60 ))" >> "$GITHUB_ENV"

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build web app
        run: npm run build

      - name: Read app version
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Anne's Lens version $VERSION, versionCode $VERSION_CODE"
          if [[ "$GITHUB_REF" == refs/tags/v* && "${GITHUB_REF#refs/tags/v}" != "$VERSION" ]]; then
            echo "::warning::Tag ${GITHUB_REF#refs/tags/} does not match package.json version $VERSION"
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle (with caching)
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          # The legacy "tools" package (the action's default) no longer exists in the SDK repository.
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Decode release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            KS="$RUNNER_TEMP/quilllens-release.jks"
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KS"
            echo "ANDROID_KEYSTORE_PATH=$KS" >> "$GITHUB_ENV"
            echo "Release keystore decoded; release builds will be signed with it."
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            # A tagged release is what people install and update from: a debug-signed one would not update the next.
            echo "::error::ANDROID_KEYSTORE_BASE64 secret not set: a tagged release must be signed with the release key."
            exit 1
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 secret not set: the release APK/AAB are signed with a DEBUG key (fine for sideloading/testing, not accepted by Google Play)."
          fi

      - name: Build release APK and AAB
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleRelease bundleRelease

      - name: Collect outputs
        id: outputs
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p out
          APK=$(ls android/app/build/outputs/apk/release/*.apk | head -n 1)
          AAB=$(ls android/app/build/outputs/bundle/release/*.aab | head -n 1)
          cp "$APK" "out/QuillLens-$VERSION.apk"
          cp "$AAB" "out/QuillLens-$VERSION.aab"
          (cd out && sha256sum QuillLens-* > SHA256SUMS.txt)
          ls -la out
          echo "apk=out/QuillLens-$VERSION.apk" >> "$GITHUB_OUTPUT"
          echo "aab=out/QuillLens-$VERSION.aab" >> "$GITHUB_OUTPUT"

      - name: Upload APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: QuillLens-${{ steps.version.outputs.version }}-apk
          path: ${{ steps.outputs.outputs.apk }}
          if-no-files-found: error

      - name: Upload AAB
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: QuillLens-${{ steps.version.outputs.version }}-aab
          path: ${{ steps.outputs.outputs.aab }}
          if-no-files-found: error

      - name: Upload checksums
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: QuillLens-${{ steps.version.outputs.version }}-sums
          path: out/SHA256SUMS.txt
          if-no-files-found: error

  prerelease:
    name: Publish GitHub prerelease (manual, any branch)
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.prerelease && !startsWith(github.ref, 'refs/tags/') && github.workflow == 'Android'
    runs-on: ubuntu-latest
    permissions:
      contents: write # creates the release
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: QuillLens-${{ needs.build.outputs.version }}-*
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: v${{ needs.build.outputs.version }}-build.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: Anne's Lens ${{ needs.build.outputs.version }} (build ${{ github.run_number }})
          prerelease: true
          generate_release_notes: true
          body: |
            Test build from branch `${{ github.ref_name }}` at ${{ github.sha }}.
            Install the APK on Android by sideloading (see docs/ANDROID.md).
          files: |
            out/QuillLens-*.apk
            out/QuillLens-*.aab
            out/SHA256SUMS.txt
