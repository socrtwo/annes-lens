name: End-to-end

# Both end-to-end suites on every push and pull request: the web app in Chromium (tests/e2e/smoke.mjs) and the
# desktop app in Electron under a virtual display (tests/e2e/desktop.mjs), against the build with the test hooks
# (npm run build:test; release builds carry none). Third-party actions are pinned to commit SHAs.

on:
  push:
    branches: ['**']
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'LICENSE'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'LICENSE'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Web and desktop
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Chromium for Playwright
        run: npx playwright install --with-deps chromium
      # People runs the real SFace model (9.9 MB, Apache-2.0, OpenCV Zoo); the test takes it from this cache.
      # The checksum is that of the copy scripts/gen-people-fixtures.py downloaded from the same address.
      - name: Face model for the People test
        run: |
          D=node_modules/.cache/annes-lens-models; mkdir -p "$D"
          curl -fsSL -A 'AnnesLensTests/1.0 (https://github.com/socrtwo/annes-lens; test fixtures)' -o "$D/face_recognition_sface_2021dec_int8.onnx" \
            https://huggingface.co/opencv/face_recognition_sface/resolve/main/face_recognition_sface_2021dec_int8.onnx
          echo "2b0e941e6f16cc048c20aee0c8e31f569118f65d702914540f7bfdc14048d78a  $D/face_recognition_sface_2021dec_int8.onnx" | sha256sum -c -
      - name: Build with the test hooks
        run: npm run build:test
      - name: Web end-to-end
        run: npm run e2e
      # The Electron binary comes from the package's install script, which npm ci does not always run.
      - name: Electron binary
        run: test -x node_modules/electron/dist/electron || node node_modules/electron/install.js
      - name: Desktop end-to-end
        run: xvfb-run -a npm run e2e:desktop
